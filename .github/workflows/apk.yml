name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Derle
        run: gradle --no-daemon assembleRelease
      - name: APK adını düzelt
        run: cp app/build/outputs/apk/release/app-release.apk kahin-x.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kahin-x-apk
          path: kahin-x.apk
      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: KAHİN X (son sürüm)
          body: Telefona indirip kur. Eski sürümün üstüne kurulur, öğrenilen veri silinmez.
          files: kahin-x.apk
          make_latest: true
