name: Kalkan VPN yayınla
on:
  push:
    branches: [kalkan-vpn]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kalkan-vpn-son --yes --cleanup-tag || true
          gh release create kalkan-vpn-son kalkan-vpn.apk \
            --target kalkan-vpn \
            --title "Kalkan VPN 1.0" \
            --notes "WireGuard tabanlı Android VPN istemcisi. Bir WireGuard ayar dosyası (.conf) ile çalışır."
