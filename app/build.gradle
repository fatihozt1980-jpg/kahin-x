plugins { id 'com.android.application' }

android {
    namespace 'app.afetrehberi'
    compileSdk 34

    defaultConfig {
        applicationId 'app.afetrehberi'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0'
    }
    // Sabit imza: her yeni sürüm eskisinin üstüne kurulur, acil kart ve çanta listesi silinmez.
    signingConfigs {
        fixed {
            storeFile file('../afet.keystore')
            storePassword 'afet-rehberi'
            keyAlias 'afet'
            keyPassword 'afet-rehberi'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
