plugins { id 'com.android.application' }

android {
    namespace 'app.kahinx'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kahinx'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '4.3'
    }
    // Sabit imza: her derleme aynı anahtarla imzalanır, böylece güncelleme eski sürümün üstüne kurulur ve öğrenilen veri silinmez.
    signingConfigs {
        fixed {
            storeFile file('../kahinx.keystore')
            storePassword 'kahinx-app'
            keyAlias 'kahinx'
            keyPassword 'kahinx-app'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
