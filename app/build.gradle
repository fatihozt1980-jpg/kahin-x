plugins { id 'com.android.application' }

android {
    namespace 'app.oyundunyasi'
    compileSdk 34

    defaultConfig {
        applicationId 'app.oyundunyasi'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0'
    }
    // Sabit imza: yeni sürüm eskinin üstüne kurulur, rekorlar silinmez.
    signingConfigs {
        fixed {
            storeFile file('../oyun.keystore')
            storePassword 'oyun-app'
            keyAlias 'oyun'
            keyPassword 'oyun-app'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.fixed }
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
